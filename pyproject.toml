[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "easyvaluator"
dynamic = ["version"]
description = "A multi-currency, region-aware DCF stock valuation tool"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Denis Beliaev" }]
requires-python = ">=3.10"
keywords = ["dcf", "valuation", "finance", "wacc", "stocks", "yfinance"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Office/Business :: Financial :: Investment",
    "Typing :: Typed",
]
dependencies = [
    "yfinance>=0.2.60",
    "pandas>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "pandas-stubs",
]

[project.scripts]
easyvaluator = "easyvaluator.cli:main"

[tool.setuptools.dynamic]
version = { attr = "easyvaluator.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
easyvaluator = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests", "src"]
addopts = "-ra --strict-markers --doctest-modules --import-mode=importlib"
markers = ["network: hits the live Yahoo Finance API (deselect with -m 'not network')"]

[tool.coverage.run]
source = ["easyvaluator"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests"]
extend-exclude = ["valuatorGPT.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PT", "C4"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["yfinance.*"]
ignore_missing_imports = true
